name: ci

on:
  push:
    branches: [main, 'work/**', 'integration/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps-web:
    name: '@wss/web lint typecheck unit build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: npm ci (repo root)
        run: npm ci
      # Optional native bindings often skipped after cross-platform lock (npm/cli#4828):
      # - oxlint: lint failed on f6a40c2
      # - rolldown: vitest failed on 682721a (run 39584103562)
      # - lightningcss (nested under @tailwindcss/node): vitest failed on
      #   b66413b (run 39584274930) and tip 585d9d1 (run 39584380863)
      # - LCV via require.resolve('@tailwindcss/node/package.json') crashed on
      #   eba42f4 (run 39584927890): ERR_PACKAGE_PATH_NOT_EXPORTED under Node 22
      - name: ensure linux native bindings
        working-directory: apps/web
        run: |
          OXV="$(node -p "require('oxlint/package.json').version")"
          RDV="$(node -p "require('rolldown/package.json').version")"
          # Resolve lightningcss version via filesystem only (Node 22 blocks
          # require.resolve('@tailwindcss/node/package.json') -- package exports)
          LCV=""
          if [ -f node_modules/@tailwindcss/node/node_modules/lightningcss/package.json ]; then
            LCV="$(node -p "require('./node_modules/@tailwindcss/node/node_modules/lightningcss/package.json').version")"
          elif [ -f node_modules/lightningcss/package.json ]; then
            LCV="$(node -p "require('./node_modules/lightningcss/package.json').version")"
          else
            echo "lightningcss package.json not found"; exit 1
          fi
          npm install --no-save \
            "@oxlint/binding-linux-x64-gnu@${OXV}" \
            "@rolldown/binding-linux-x64-gnu@${RDV}" \
            "lightningcss-linux-x64-gnu@${LCV}"
      - name: lint
        run: npm run lint -w @wss/web
      - name: typecheck
        run: npm run typecheck -w @wss/web
      - name: unit
        run: npm run test -w @wss/web
      - name: build
        run: npm run build -w @wss/web

  e2e:
    name: e2e (disabled in CI for now)
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: ensure linux native bindings
        working-directory: apps/web
        run: |
          OXV="$(node -p "require('oxlint/package.json').version")"
          RDV="$(node -p "require('rolldown/package.json').version")"
          LCV=""
          if [ -f node_modules/@tailwindcss/node/node_modules/lightningcss/package.json ]; then
            LCV="$(node -p "require('./node_modules/@tailwindcss/node/node_modules/lightningcss/package.json').version")"
          elif [ -f node_modules/lightningcss/package.json ]; then
            LCV="$(node -p "require('./node_modules/lightningcss/package.json').version")"
          else
            echo "lightningcss package.json not found"; exit 1
          fi
          npm install --no-save \
            "@oxlint/binding-linux-x64-gnu@${OXV}" \
            "@rolldown/binding-linux-x64-gnu@${RDV}" \
            "lightningcss-linux-x64-gnu@${LCV}"
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - working-directory: apps/web
        run: |
          export NODE_PATH="$PWD/node_modules"
          npx playwright test
