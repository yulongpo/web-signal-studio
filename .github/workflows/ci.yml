name: ci

on:
  push:
    branches: [main, 'work/**', 'integration/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps-web:
    name: '@wss/web lint typecheck unit build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      # Monorepo root lock (workspaces). apps/web nested lock alone is out of sync with
      # package name @wss/web and caused npm ci EUSAGE on main a904334 / run 39583728389.
      - name: npm ci (repo root)
        run: npm ci
      # oxlint optional native binding: npm ci often skips linux-x64-gnu (npm/cli#4828).
      - name: ensure oxlint linux binding
        working-directory: apps/web
        run: |
          VER="$(node -p "require('oxlint/package.json').version")"
          npm install --no-save "@oxlint/binding-linux-x64-gnu@${VER}"
      - name: lint
        run: npm run lint -w @wss/web
      - name: typecheck
        run: npm run typecheck -w @wss/web
      - name: unit
        run: npm run test -w @wss/web
      - name: build
        run: npm run build -w @wss/web

  e2e:
    name: e2e (disabled in CI for now)
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: ensure oxlint linux binding
        working-directory: apps/web
        run: |
          VER="$(node -p "require('oxlint/package.json').version")"
          npm install --no-save "@oxlint/binding-linux-x64-gnu@${VER}"
      - working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - working-directory: apps/web
        run: |
          export NODE_PATH="$PWD/node_modules"
          npx playwright test