name: ci

on:
  push:
    branches: [main, 'work/**', 'integration/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps-web:
    name: '@wss/web lint typecheck unit build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: npm ci (apps/web)
        working-directory: apps/web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      # oxlint optional native binding: npm ci often skips linux-x64-gnu (optional + libc
      # matching; npm/cli#4828). Main run 39583037963 failed at lint with
      # "Cannot find module '@oxlint/binding-linux-x64-gnu'". Force-install for ubuntu.
      - name: ensure oxlint linux binding
        working-directory: apps/web
        run: |
          VER="$(node -p "require('oxlint/package.json').version")"
          npm install --no-save "@oxlint/binding-linux-x64-gnu@${VER}"
      - name: lint
        working-directory: apps/web
        run: npm run lint
      - name: typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: unit
        working-directory: apps/web
        run: npm test
      - name: build
        working-directory: apps/web
        run: npm run build

  e2e:
    name: e2e (disabled in CI for now)
    if: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: ensure oxlint linux binding
        run: |
          VER="$(node -p "require('oxlint/package.json').version")"
          npm install --no-save "@oxlint/binding-linux-x64-gnu@${VER}"
      - run: npx playwright install --with-deps chromium
      - run: |
          export NODE_PATH="$PWD/node_modules"
          npx playwright test