# Web Signal Studio — CI placeholder (P0-G / WSS-QA-G)
# Goals: lint / typecheck / unit / build. Expand when workspace scripts stabilize.
name: ci

on:
  push:
    branches: [main, 'work/**', 'integration/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install (root workspaces)
        run: npm install
        continue-on-error: true
      - name: Lint apps/web (oxlint)
        working-directory: apps/web
        run: |
          if [ -f package.json ]; then
            npm install
            npm run lint --if-present
          else
            echo "apps/web not ready — lint placeholder"
            exit 0
          fi
        continue-on-error: true

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm install
        continue-on-error: true
      - name: Typecheck packages (tsc --noEmit when present)
        run: |
          npx --yes tsc -b --pretty false 2>/dev/null || \
          npx --yes tsc --noEmit -p packages/contracts 2>/dev/null || \
          echo "typecheck placeholder — no tsconfig project graph yet"
        continue-on-error: true
      - name: Typecheck apps/web
        working-directory: apps/web
        run: |
          if [ -f tsconfig.json ] || [ -f tsconfig.app.json ]; then
            npm install
            npx tsc -b --pretty false
          else
            echo "apps/web tsconfig missing — placeholder"
            exit 0
          fi
        continue-on-error: true

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm install
        continue-on-error: true
      - name: Unit (vitest)
        run: |
          if npm run test --if-present; then
            echo "unit ok"
          else
            echo "unit placeholder — no tests yet"
            exit 0
          fi
        continue-on-error: true

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install root
        run: npm install
        continue-on-error: true
      - name: Build workspaces
        run: npm run build --if-present
        continue-on-error: true
      - name: Build apps/web
        working-directory: apps/web
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build --if-present
          else
            echo "apps/web build placeholder"
            exit 0
          fi
        continue-on-error: true

  # e2e reserved for when Playwright + local server are wired (P5+)
  # e2e:
  #   name: e2e
  #   runs-on: ubuntu-latest
  #   needs: [build]
